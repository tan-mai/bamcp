# BAMCP - BTC Analysis MCP
# Doi duong dan o day khi deploy. Khong sua server.py.
# Bien moi truong thang config: BAMCP_HOST, BAMCP_PORT, BAMCP_ALLOWED_HOSTS,
# BAMCP_DATA_ROOT, BAMCP_USERNAME, BAMCP_PASSWORD, BAMCP_SYMBOL, BAMCP_MARKET, TZ,
# BAMCP_ACCOUNT_ENABLED (true/false - tat nhanh phan doc tai khoan khi test),
# BAMCP_ORB_ENABLED (true/false - bat/tat module ORB).

server:
  host: "0.0.0.0"            # 0.0.0.0 khi chay trong container; 127.0.0.1 khi chay truc tiep sau Caddy
  port: 8848
  mcp_path: "/mcp"           # URL connector se la https://<domain><mcp_path>
  health_path: "/healthz"    # public, khong can auth (Docker HEALTHCHECK + proxy)
  admin_path: "/admin"       # trang dat username/password va credential san
  log_level: "info"
  behind_proxy: true         # tin X-Forwarded-* khi chay sau Caddy/nginx

  auth:                      # HTTP Basic authentication
    enabled: true
    username: "bamcp"        # co the de o day, KHONG nen de password o day
    password: ""             # de RONG -> doc tu bien moi truong BAMCP_PASSWORD
    realm: "BAMCP"

  allowed_hosts:             # Host header hop le. BAT BUOC them domain that khi chay sau proxy.
                             # Dang "host:*" cho phep moi port. De rong = tat kiem tra (khong khuyen khich).
    - "127.0.0.1:*"
    - "localhost:*"
    - "btc.example.com"
    - "btc.example.com:*"

timezone: "Asia/Ho_Chi_Minh"

paths:
  # Windows dev:  ./data          (tuong doi so voi config.yaml)
  # Docker:       /data           (mount volume vao day)
  data_root: "./data"
  klines_dir: "klines"       # tuong doi so voi data_root
  bias_dir: "bias"
  journal_dir: "journal"
  kline_filename: "{timeframe}.json"   # vd: 4h.json
  rules_file: "rules.json"      # tuong doi so voi data_root; sinh tu `rules:` ben duoi o lan doi dau
  settings_file: "settings.json" # username/password va credential san, do trang admin ghi

fetcher:
  enabled: true
  symbol: "BTCUSDT"
  market: "futures"          # futures = perpetual swap (dung cai nay neu ban trade perp)
                             # spot     = san giao ngay. Volume hai ben KHAC NHAU.
  base_url_futures: "https://fapi.binance.com/fapi/v1/klines"
  base_url_spot: "https://api.binance.com/api/v3/klines"
  interval_seconds: 900      # 15 phut
  fetch_limit: 500           # so nen moi lan pull (Binance toi da 1000)
  max_history: 1000          # so nen giu lai trong file sau khi merge
  request_timeout: 20
  retry: 3
  run_on_start: true

# TM - #GANN-TW - Gann Time Windows
# So nen toi da giu theo tung khung. null = khong cat.
# Khung nao khong khai thi dung klines.max_history nhu truoc.
# D va W phai la null thi pivot Gann moi co du lich su tu 2019-09.
retention:
  "1w": null
  "1d": null

klines:
  # File kline duoc tu nhan dang: mang Binance tho [[openTime,o,h,l,c,v,closeTime,...]]
  # hoac object [{"openTime":..,"open":..,...}]. Fetcher luon ghi dang mang Binance tho.
  # Neu file JSON boc trong 1 key (vd {"data": [...]}), dien ten key vao day
  wrapper_key: ""
  timeframes: ["1w", "1d", "4h", "1h", "15m"]
  # Khung chi keo khi goi refresh_data(timeframes=["5m"]) hoac trong giai doan
  # watch cua ORB. Fetcher nen KHONG bao gio keo cac khung nay.
  on_demand_timeframes: ["5m"]
  default_limit: 120
  max_limit: 1000
  context_lookback: 60       # so nen dung de tinh range / volume trung binh
  swing_strength: 2          # fractal: dinh/day phai cao/thap hon N nen moi ben


# Doc du lieu tai khoan that tu san. Tat = chi co nhat ky tu khai.
# KEY VA SECRET KHONG BAO GIO DE O DAY - chung di qua bien moi truong:
#   BAMCP_EXCHANGE_KEY, BAMCP_EXCHANGE_SECRET, BAMCP_EXCHANGE_PASSPHRASE (rieng OKX)
# Tao key voi DUY NHAT quyen doc: tat quyen trade, tat quyen rut tien, bat IP whitelist.
account:
  enabled: true
  exchange: "okx"        # binance | bybit | okx
  symbol: ""                 # bo trong = mac dinh cua tung san:
                             #   binance BTCUSDT | bybit BTCUSDT | okx BTC-USDT-SWAP
  recv_window: 5000          # ms, do lech dong ho cho phep
  request_timeout: 20
  pnl_tolerance: 0.5         # lech PnL duoi muc nay thi reconcile_journal coi la khop

  binance:
    base_url: "https://fapi.binance.com"
  bybit:
    base_url: "https://api.bybit.com"
    category: "linear"       # linear = USDT perp
  okx:
    base_url: "https://www.okx.com"
    inst_type: "SWAP"

# Gia tri KHOI TAO. Lan dau update_rules duoc goi, ban sao ghi sang data/rules.json
# va tu do file do la nguon su that. Sua o day chi anh huong khi rules.json chua co,
# hoac khi ban them mot rule moi chua ton tai trong file.
# Quy dinh giao dich. Day chi la HAT GIONG: lan dau chay, cac so nay duoc ghi
# xuong data/rules.json; tu do tro di rules.json la nguon that, sua o day khong
# con tac dung. Doi rule bang trang /admin hoac tool update_rules.
#
# Rule chia lam hai pham vi:
#
#   CHUNG - mot bo duy nhat cho ca tai khoan. Vi tai khoan chi co mot, nen ngan
#   sach rui ro cung chi co mot: het quota la het, du lenh nam o cap nao.
#
#   RIENG TUNG CAP - moi cap giu nguong cua no. May rule nay do bang DIEM GIA,
#   ma diem cua moi cap la mot thu khac nhau: 300 diem tren BTC la mot nhip nho,
#   300 diem tren ADA la ca mot chu ky. Dung chung mot con so thi hoac qua chat
#   cho cap nay hoac qua long cho cap kia.
#
# Cac so ben duoi vua la rule chung, vua la MAC DINH cho phan rieng: cap nao
# chua dat rieng thi ke thua dung nhung so nay.
rules:
  # --- CHUNG cho moi cap ---
  max_trades_per_day: 3
  max_margin_per_trade: 20
  daily_stop_loss: -20               # gop PnL cua tat ca cac cap
  swing_max_margin_per_trade: 0      # 0 = khong gioi han volume

  # --- RIENG tung cap (so o day la mac dinh khi cap chua dat rieng) ---
  max_stop_points: 300
  min_take_profit_points: 500

  # Nguong swing. Lenh chi duoc huong han muc swing khi TP that su dat
  # swing_min_take_profit_points - dan nhan "swing" khong lach duoc.
  swing_min_take_profit_points: 2000
  swing_max_stop_points: 1500

# ORB - Opening Range Breakout. OR = nen M15 DAU TIEN cua moi phien.
# Tham so CHUNG o day (sua xong thi restart). Danh sach PHIEN (gio mo, timezone,
# ngay giao dich, override rieng) quan ly o trang <admin_path>/orb, luu o
# sessions_store_path - khong can restart. default_sessions chi la hat giong cho
# lan chay dau, khi file phien chua ton tai.
# Moi duong dan tuong doi deu tinh tu data_root.
# TM - #ORB-RULES - ORB Rule Set: nguong cham lenh, quota/daily stop, sizing va tham
# so chien luoc ORB (tp_r, buffer_pct, OR/ATR, bias, news...) KHONG con doc tu day.
# Chung nam trong khoi `orb` cua data/rules.json - doi bang update_rules(orb=true) hoac
# muc "Rule ORB" o /admin/orb (bat buoc ly do, ghi lich su, co hieu luc ngay).
# Lan dau chay, khoi do duoc migrate tu gia tri cu (neu con) + mac dinh cua BR.
# Field cu con sot lai o day (risk.*, exit.tp_r, ...) bi bo qua va bao trong
# get_orb_config.warnings.
orb:
  enabled: true                      # bat module (scheduler, tool, trang admin); cong tac
                                     # nghiep vu la orb.enabled trong rules.json
  symbol: "BTCUSDT"
  or_timeframe: "M15"
  watch_timeframe: "M5"
  sessions_store_path: "orb/sessions.json"
  scheduler:
    candle_close_delay_seconds: 20   # doi nen dong them 20 giay roi moi pull
  defaults:                          # phien de trong truong nay thi dung gia tri o day
    trade_window_minutes: 180        # tinh tu luc OR chot
    max_trades: 1                    # so lenh ORB toi da moi phien (quota ngay: orb.max_trades_per_day)
  entry:
    mode: "close"                    # close | touch | retest
    failed_lookback_bars: 3          # so nen M5 de xac nhan failed breakout
  exit:
    sl_mode: "opposite"              # opposite | mid
  filters:
    atr_timeframe: "H1"
    atr_period: 14
    news_days_file: "orb/news_days.json"   # [{"date": "2026-10-02", "note": "CPI"}] - sua o /admin/orb
  costs:
    taker_fee_pct: 0.05              # moi chieu
    slippage_pct: 0.02               # moi chieu
  exchange_limits:                   # Binance USDT-M BTCUSDT; doi san thi kiem tra lai
    qty_step: 0.001
    min_notional_usd: 100
  data:
    m5_history_path: "orb/history"   # M5 lich su tu data.binance.vision
    history_years: 2
    backtest_output_path: "orb/backtests"
  default_sessions:
    - session_id: "ldn"
      name: "London"
      timezone: "Europe/London"
      open_time: "08:00"
      trade_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
      holiday_calendar: "UK"
      trade_window_minutes: null
      max_trades: null
      overrides: {}
      enabled: true
    - session_id: "ny"
      name: "New York"
      timezone: "America/New_York"
      open_time: "09:30"
      trade_days: ["Mon", "Tue", "Wed", "Thu", "Fri"]
      holiday_calendar: "US"
      trade_window_minutes: null
      max_trades: null
      overrides: {}
      enabled: true

# Quy trinh phan tich ma Claude doc luc bat tay. Sua o day, `docker compose restart`,
# roi tat/bat lai connector trong chat de Claude doc ban moi. Khong can build lai image.
instructions: |
  Du lieu BTC da khung tu Binance. Moi con so phai lay tu cac tool nay,
  khong duoc uoc luong hay nho lai.

  Quy trinh: get_context(W/D/H4) -> save_bias -> get_context(H1/M15) tim entry
  -> get_today_status truoc khi vao lenh.

  QUAN TRONG - nen da dong: khoi 'vsa' duoc tinh tren nen DA DONG. Khoi 'current_bar'
  la nen dang chay, chi dung de biet gia hien tai, TUYET DOI khong dung volume/spread
  cua no de ket luan VSA. get_klines mac dinh cung chi tra nen da dong.

  Neu freshness.stale = true thi du lieu da tre, goi refresh_data truoc khi phan tich.

  Quy dinh giao dich doc bang get_rules, doi bang update_rules (bat buoc co ly do).
  Neu get_today_status bao rules_changed_today khong rong thi noi ro dieu do ra
  truoc khi ban tiep chuyen vao lenh.

  Neu account.enabled = true thi con doc duoc tai khoan that: get_positions cho vi the
  dang mo, get_fills cho lenh da khop, get_account_pnl cho PnL that (da tru phi va
  funding), reconcile_journal de doi chieu nhat ky voi san. Khi khoi 'exchange' trong
  get_today_status co du lieu thi tin so do, khong tin so tu khai trong nhat ky.

  HAI LOAI LENH - phan biet truoc khi ban ve size:

  SWING - co hoi an bien lon. Chi goi la swing khi HOI DU:
    - Cau truc khung lon (W/D) va H4 cung huong, khong nguoc nhau
    - Gia dang o vung bien cua range tren khung lon (close_position_pct duoi 25
      hoac tren 75), khong phai giua range
    - Co swing high/low ro rang lam moc cho SL va TP
    - TP kha thi >= nguong swing_min_take_profit_points, do bang khoang cach
      thuc den swing gan nhat hoac bien range - KHONG phai uoc chung
    Dat duoc ca bon thi moi de xuat trade_type="swing". Thieu mot cai thi noi
    thang la khong du dieu kien, dung ha tieu chuan cho vua.

  SCALP - moi truong hop con lai. Setup o H1/M15, TP nho, va PHAI theo han muc
    max_margin_per_trade. Day la mac dinh.

  Truoc khi ban chot size, goi check_trade de cham thu: no cho biet lenh duoc
  xep loai gi, han muc nao ap dung, pham rule gi - ma khong ghi vao nhat ky.
  Khai swing nhung TP khong dat nguong thi he thong tu ha xuong scalp va ghi lai.

  Khi nguoi dung hoi "co co hoi swing khong", tra loi bang bon tieu chi tren
  kem so lieu that tu get_context, khong tra loi chung chung.

  NHIEU CAP GIAO DICH: he thong theo doi nhieu cap, khong chi BTC. Moi tool
  phan tich deu nhan tham so symbol; bo trong la lay cap mac dinh.

  - Goi list_timeframes de biet dang theo doi nhung cap nao va cap nao da co
    du lieu. Cap vua them co the chua kip pull ve.
  - get_context(symbol="ETHUSDT"), get_klines(timeframe="4h", symbol="ETHUSDT"),
    save_bias(symbol="ETHUSDT", ...), get_bias(symbol="ETHUSDT").
  - Moi cap co bias RIENG. Dung dung bias cua cap nay de ket luan cho cap khac.
  - Phuong phap khong doi theo cap: van Wyckoff/VSA/GANN, van di tu khung lon
    xuong khung nho, van chi doc VSA tren nen da dong.
  - Nguoi dung khong noi ro cap nao thi hoi lai, dung tu doan - tru khi ho dang
    noi tiep ve mot cap vua nhac den.

  RULE CO HAI PHAM VI - nho phan biet, vi nham cho la doc nham nguong:

  CHUNG cho ca tai khoan: max_trades_per_day, max_margin_per_trade,
  daily_stop_loss, swing_max_margin_per_trade. Het quota la het, du la cap nao.
  Doi may rule nay thi goi update_rules KHONG kem symbol.

  RIENG tung cap: max_stop_points, min_take_profit_points,
  swing_min_take_profit_points, swing_max_stop_points. May cai nay do bang diem
  gia, ma 300 diem tren BTC voi 300 diem tren ADA khong noi len cung mot dieu.
  Doi may rule nay thi BAT BUOC kem symbol; goi khong kem symbol se bi tu choi.

  Vi vay luon truyen symbol cho get_rules, check_trade, log_trade va
  get_today_status. Bo trong la lay cap mac dinh - va ban se cham lenh cua cap
  nay bang nguong cua cap khac ma khong hay biet.

  get_rules(symbol="ETHUSDT") tra ve bo so da giai cho ETH (rule chung + phan
  ETH dat rieng, hoac mac dinh neu ETH chua dat rieng). Khoi 'symbol_overrides'
  cho biet cap nao dang dat rieng nhung rule gi.

  DOC TAI KHOAN NHIEU CAP: get_positions, get_fills, get_account_pnl va
  reconcile_journal chay tren TOAN BO danh sach cap trong trang admin. Moi tool
  nhan symbol de loc ve mot cap; bo trong la gop tat ca.

  - get_today_status co khoi by_symbol cho biet PnL tung cap, va errors cho biet
    cap nao doc khong duoc. Neu errors khong rong thi NOI RA - so lieu dang
    thieu, dung ket luan nhu the day du.
  - position_id mang tien to cap: BTCUSDT-P1. Vi the gom rieng tung cap.
  - Quota lenh va daily_stop_loss van tinh gop tat ca cac cap.

  ORB - OPENING RANGE BREAKOUT (chi tren cap orb.symbol, mac dinh BTCUSDT):
  Lenh ORB co BO RULE RIENG (khoi 'orb' cua get_rules), khong dung max_stop_points /
  min_take_profit_points / max_trades_per_day / daily_stop_loss cua scalp-swing.
  - Cham lenh ORB: SL <= orb.max_stop_points, TP >= orb.min_take_profit_points,
    R:R >= orb.min_rr, va SL phai nam trong vung an toan thanh ly.
  - Quota va daily stop cua ORB tinh RIENG (orb.max_trades_per_day,
    orb.daily_stop_loss): get_today_status co orb_trades_remaining,
    orb_daily_stop_hit, can_trade_orb. Lenh ORB khong an quota chung va nguoc lai.
  - Size ORB = orb.margin_usd x orb.leverage / gia vao, lam tron xuong qty_step.
    Khong tinh size theo risk_usd.
  - Doi rule ORB: update_rules(orb=true, changes={...}, reason=..., symbol=... hoac
    session_id=...). Bo trong ca hai la doi orb.defaults. Luon co ly do.
  - get_orb_config.warnings co 'rule_infeasible' (vd TP toi thieu khong the dat voi
    tp_r va max_or_atr_ratio hien tai) thi NOI RA truoc khi ban plan.
  - Cap chua dat rule ORB (loi "chua dat rule ORB cho ...") thi lenh ORB bi chan -
    bao nguoi dung dat rule, khong tu doan nguong.

  OR = nen M15 DAU TIEN cua phien. Moi gio deu theo timezone cua tung phien
  (tu xu ly gio mua he), tool tra ca UTC lan gio VN.

  Quy trinh:
  1. get_bias -> bias D/H4 (bo loc bias cua ORB doc tu day).
  2. list_orb_sessions -> phien nao bat, gio mo ke tiep, watch M5 co dang chay.
  3. get_opening_range -> High/Low cua OR va range_flag (ok/too_narrow/too_wide).
     status khac 'set' thi CHUA co OR chot - dung ket luan.
  4. check_orb_signal -> state, trigger_candle (nen M5 da dong) va plan.
     Tu danh gia volume/VSA cua trigger_candle bang so lieu tool tra ve.
  5. Quyet dinh:
     - plan co blocked_by chua "rules" nghia la plan pham rule ORB - doc
       plan.rule_check.violations, khong de xuat vao lenh.
     - vao lenh: check_trade(strategy="ORB", session_id=...) -> nguoi dung tu dat
       lenh tren san -> log_trade(strategy="ORB", session_id=..., variant=...).
     - gia da chay xa vung entry, khong duoi: skip_orb_session(session_id, reason).
     - chua co tin hieu: goi lai check_orb_signal sau (scheduler tu keo M5 5 phut/lan).

  BAMCP KHONG dat lenh. plan chi la de xuat da tinh san phi va truot gia vao R.
  Neu check_orb_signal co warning 'stale_m5' hoac data_status khac 'ok' thi noi ra.
  state FILTERED / EXPIRED / SKIPPED / TAKEN nghia la phien do khong con vao lenh.
  Backtest: backtest_orb(from_date, to_date, ...) -> neu status=running thi
  get_backtest_result(run_id) sau. Tham so dang ap dung: get_orb_config.
