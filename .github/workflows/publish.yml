name: Build va push image len ghcr.io

# Chay moi lan push len main, hoac bam tay tu tab Actions.
# Muc dich: khong can Docker tren may ca nhan, khong can SSH vao VPS.
on:
  push:
    branches: [main]
    paths:
      - "server.py"
      - "exchanges.py"
      - "probe.py"
      - "config.yaml"
      - "requirements.txt"
      - "Dockerfile"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # Ten image phai viet thuong, ma ten GitHub co the co chu hoa
      - name: Xac dinh ten image
        id: img
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Dang nhap ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build va push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ${{ steps.img.outputs.name }}:latest
            ${{ steps.img.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: In ten image de dan vao panel
        run: echo "Image = ${{ steps.img.outputs.name }}:latest"
